[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# NOTE: no /api/* rewrite here. The OpenNext adapter already provisions the
# function that serves route handlers and Server Actions. A blanket
# "/api/* -> /.netlify/functions/:splat" rule overrides that mapping, so every
# route handler 404s with Netlify's HTML error page, and the 404 HTML breaks
# Server Actions too (their client expects a JSON response).

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
